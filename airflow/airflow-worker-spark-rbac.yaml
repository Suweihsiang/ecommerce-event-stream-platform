apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-pod-manager
  namespace: spark
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec"]
    verbs: ["get", "list", "watch", "create", "delete", "deletecollection", "patch", "update"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete", "deletecollection", "patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-pod-manager-binding-spark
  namespace: spark
subjects:
  - kind: ServiceAccount
    name: spark
    namespace: spark
  - kind: ServiceAccount
    name: default
    namespace: spark
roleRef:
  kind: Role
  name: spark-pod-manager
  apiGroup: rbac.authorization.k8s.io